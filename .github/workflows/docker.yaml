name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Build controller and embedded Pomerium Core
        env:
          POMERIUM_OFFICIAL_BUILD: "0"
          VERSION: ${{ github.ref_name }}
        run: make build-ci

      - name: Check native binary
        run: |
          ./bin/manager-linux-amd64 --version | tee "$RUNNER_TEMP/controller-version.txt"
          grep -F 'Apache License 2.0' "$RUNNER_TEMP/controller-version.txt"

      - name: Package release artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            package_dir="$RUNNER_TEMP/ingress-controller-linux-$arch"
            mkdir -p "$package_dir"
            install -m 755 "bin/manager-linux-$arch" "$package_dir/ingress-controller"
            install -m 644 LICENSE "$package_dir/LICENSE"
            tar -czf "dist/ingress-controller_${RELEASE_TAG}_linux_${arch}.tar.gz" \
              -C "$package_dir" ingress-controller LICENSE
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=semver,pattern={{raw}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish controller image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_flags[@]}"
          fi
